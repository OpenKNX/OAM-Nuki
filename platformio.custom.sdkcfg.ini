;
; sdkconfig presets for ESP32/IDF environments
; Extend any [env:*] with one of these to activate the IDF pre-scripts.
;
[sdkcfg_wifi_off]
custom_sdkconfig =
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_80=y
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ=80
  CONFIG_PM_ENABLE=y
  CONFIG_ESP_BROWNOUT_DET=y
  CONFIG_ESP_BROWNOUT_DET_LVL=6
  CONFIG_ESP_PHY_MAX_WIFI_TX_POWER=8
  CONFIG_ESP_PHY_MAX_TX_POWER=8
  CONFIG_ESP_PHY_REDUCE_TX_POWER=y
  CONFIG_ESP_PHY_RF_CAL_PARTIAL=y
  CONFIG_BT_ENABLED=y
  CONFIG_BT_BLE_ENABLED=y
  CONFIG_BT_CLASSIC_ENABLED=n
  CONFIG_BT_BLE_42_FEATURES_SUPPORTED=y
  CONFIG_BT_NIMBLE_ENABLED=y
  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
  CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=y
  CONFIG_BT_CTRL_DFT_TX_POWER_LEVEL_EFF=0
  CONFIG_ESP_TASK_WDT_TIMEOUT_S=10
  CONFIG_ESP_WIFI_ENABLED=n
  CONFIG_ESP_WIFI_SOFTAP_SUPPORT=n
  CONFIG_ESP_WIFI_NAN_ENABLE=n
  CONFIG_ESP_COEX_ENABLED=n
  CONFIG_ESP_WIFI_COEXIST_ENABLE=n
  CONFIG_ESP_WIFI_STATION_ROAMING_EXT_CALIBRATION=n
  CONFIG_ESP_INSIGHTS_ENABLED=n
  CONFIG_ESP_DIAGNOSTICS_ENABLED=n

[sdkcfg_wifi_on]
custom_sdkconfig =
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_80=y
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ=80
  CONFIG_PM_ENABLE=y
  CONFIG_ESP_BROWNOUT_DET=y
  CONFIG_ESP_BROWNOUT_DET_LVL=6
  CONFIG_ESP_PHY_MAX_WIFI_TX_POWER=8
  CONFIG_ESP_PHY_MAX_TX_POWER=8
  CONFIG_ESP_PHY_REDUCE_TX_POWER=y
  CONFIG_ESP_PHY_RF_CAL_PARTIAL=y
  CONFIG_BT_ENABLED=y
  CONFIG_BT_BLE_ENABLED=y
  CONFIG_BT_CLASSIC_ENABLED=n
  CONFIG_BT_BLE_42_FEATURES_SUPPORTED=y
  CONFIG_BT_NIMBLE_ENABLED=y
  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
  CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=y
  CONFIG_BT_CTRL_DFT_TX_POWER_LEVEL_EFF=0
  CONFIG_ESP_TASK_WDT_TIMEOUT_S=10
  CONFIG_ESP_WIFI_ENABLED=y
  CONFIG_ESP_WIFI_SOFTAP_SUPPORT=y
  CONFIG_ESP_WIFI_STATION_ENABLED=y
  CONFIG_ESP_COEX_ENABLED=y
  CONFIG_ESP_WIFI_COEXIST_ENABLE=y
  CONFIG_ESP_COEX_SW_COEXIST_ENABLE=y
  CONFIG_ESP_WIFI_STA_DISCONNECTED_PM_ENABLE=y
  CONFIG_ESP_WIFI_SCAN_CACHE_SIZE=6
  CONFIG_ESP_INSIGHTS_ENABLED=n
  CONFIG_ESP_DIAGNOSTICS_ENABLED=n

[sdkcfg_wifi_on_nocal]
custom_sdkconfig =
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_80=y
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ=80
  CONFIG_PM_ENABLE=y
  CONFIG_ESP_BROWNOUT_DET=y
  CONFIG_ESP_BROWNOUT_DET_LVL=6
  CONFIG_ESP_PHY_MAX_WIFI_TX_POWER=8
  CONFIG_ESP_PHY_MAX_TX_POWER=8
  CONFIG_ESP_PHY_REDUCE_TX_POWER=y
  CONFIG_BT_ENABLED=y
  CONFIG_BT_BLE_ENABLED=y
  CONFIG_BT_CLASSIC_ENABLED=n
  CONFIG_BT_BLE_42_FEATURES_SUPPORTED=y
  CONFIG_BT_NIMBLE_ENABLED=y
  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
  CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=y
  CONFIG_BT_CTRL_DFT_TX_POWER_LEVEL_EFF=0
  CONFIG_ESP_TASK_WDT_TIMEOUT_S=10
  CONFIG_ESP_WIFI_ENABLED=y
  CONFIG_ESP_WIFI_SOFTAP_SUPPORT=y
  CONFIG_ESP_WIFI_STATION_ENABLED=y
  ; RF calibration: NONE = skip calibration on every boot (fastest boot, lowest boot power)
  ; RF_CAL_PARTIAL = default (good compromise).
  ; RF_CAL_FULL = full calibration on every boot (slow, not needed for production).
  CONFIG_ESP_PHY_RF_CAL_NONE=y
  ; Do not store calibration data in NVS (saves flash wear and NVS space)
  CONFIG_ESP_PHY_CALIBRATION_AND_DATA_STORAGE=n
  CONFIG_ESP_INSIGHTS_ENABLED=n
  CONFIG_ESP_DIAGNOSTICS_ENABLED=n


; --------------------------------------------------------------------------- #
; Low-power preset for ESP32-S3 IDF builds.
; WiFi and BLE remain enabled -- runtime power management is handled in application code.
; Focus: minimize boot power, reduce TX power, enable IDF power management framework,
;        skip RF calibration on every boot.
; --------------------------------------------------------------------------- #
[sdkcfg_low_power]
; Run CPU at 80 MHz (lowest clock that still allows WiFi + BLE)
board_build.f_cpu = 80000000L ; 80000000L
custom_sdkconfig =
  ; CPU: 80 MHz -- lowest clock that still allows WiFi + BLE to function reliably
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_80=y
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ=80
  ; Power Management: DFS (Dynamic Frequency Scaling) — CPU clock scales down
  ; automatically when idle, even inside a busy loop with delay().
  ; Light-sleep is NOT used (continuous main loop).
  CONFIG_PM_ENABLE=y
  ; Put sleep/wake stub in IRAM for faster wake-up (still used by BLE controller sleep)
  CONFIG_PM_SLP_IRAM_OPT=y
  ; Brownout detection
  CONFIG_ESP_BROWNOUT_DET=y
  CONFIG_ESP_BROWNOUT_DET_LVL=7
  ; Reduce default log level (less UART/USB output = less CPU wake-ups)
  CONFIG_LOG_DEFAULT_LEVEL_WARN=y
  CONFIG_LOG_DEFAULT_LEVEL=2
  ; Disable unused peripherals to save static current
  CONFIG_ESP_TEMP_SENSOR_ENABLED=n
  ; Console: redirect to USB Serial/JTAG — frees GPIO 43/44 (UART0) for KNX UART
  CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y
  CONFIG_ESP_CONSOLE_UART_NONE=y
  ; RF/PHY: reduce TX power to minimum useful level
  CONFIG_ESP_PHY_MAX_WIFI_TX_POWER=8
  CONFIG_ESP_PHY_MAX_TX_POWER=8
  CONFIG_ESP_PHY_REDUCE_TX_POWER=y
  ; RF calibration: NONE = skip calibration on every boot (fastest boot, lowest boot power)
  ; Calibration data is NOT stored in NVS (saves flash wear and NVS space)
  CONFIG_ESP_PHY_RF_CAL_NONE=y
  CONFIG_ESP_PHY_CALIBRATION_AND_DATA_STORAGE=n
  ; BLE stack
  CONFIG_BT_ENABLED=y
  CONFIG_BT_BLE_ENABLED=y
  CONFIG_BT_CLASSIC_ENABLED=n
  CONFIG_BT_BLE_42_FEATURES_SUPPORTED=y
  CONFIG_BT_NIMBLE_ENABLED=y
  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
  CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=y
  ; BLE Controller Sleep: radio off between BLE events (biggest power saver)
  CONFIG_BT_CTRL_SLEEP_MODE_EFF=1
  CONFIG_BT_CTRL_SLEEP_CLOCK_EFF=1
  ; Limit concurrent BLE activities (advertising + scan + connections)
  CONFIG_BT_CTRL_BLE_MAX_ACT_EFF=6
  ; BT TX power: 0 = -12 dBm (minimum), tune up in code if range is insufficient
  CONFIG_BT_CTRL_DFT_TX_POWER_LEVEL_EFF=0
  ; Scan duplicate filtering — reduces processing load during BLE scan
  CONFIG_BT_CTRL_SCAN_DUPL_TYPE_DEVICE=y
  CONFIG_BT_CTRL_SCAN_DUPL_CACHE_SIZE=20
  ; WDT
  CONFIG_ESP_TASK_WDT_TIMEOUT_S=10
  ; WiFi: kept enabled in sdkconfig because lib/knx and OGM-Common link against
  ; Arduino WiFi / esp_wifi symbols. WiFi PHY draws NO power as long as
  ; WiFi.begin() is never called at runtime.
  ; Disable unused WiFi features to minimise flash footprint:
  ; NOTE: SoftAP support must stay enabled — Arduino WiFiGeneric.cpp calls
  ; esp_netif_create_default_wifi_ap() unconditionally.
  CONFIG_ESP_WIFI_NAN_ENABLE=n
  CONFIG_ESP_WIFI_STATION_ROAMING_EXT_CALIBRATION=n
  ; Disable unused telemetry components
  CONFIG_ESP_INSIGHTS_ENABLED=n
  CONFIG_ESP_DIAGNOSTICS_ENABLED=n

[esp32c5_sdkcfg_low_power]
board_build.f_cpu = 80000000L
custom_sdkconfig =
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_80=y
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ=80
  CONFIG_PM_ENABLE=y

