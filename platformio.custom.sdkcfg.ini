[esp32c3_sdkcfg_low_power]
board_build.f_cpu = 80000000L
custom_sdkconfig =
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_80=y    ; Set CPU frequency to 80 MHz (lowest clock that still allows WiFi + BLE)
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ=80      ; Set default CPU frequency to 80 MHz
  
  ; Power Management: DFS — CPU clock scales down automatically when idle. Light-sleep NOT used.
  CONFIG_PM_ENABLE=y                      ; Enable IDF power management (DFS)
  CONFIG_PM_SLP_IRAM_OPT=y               ; Put sleep/wake stub in IRAM for faster wake-up
  
  ; Brownout detection: SEL_7 = 2.51V (lowest threshold). Tolerates brief voltage dips during BLE startup.
  CONFIG_ESP_BROWNOUT_DET=y               ; Enable brownout detection
  CONFIG_ESP_BROWNOUT_DET_LVL=7          ; Levels (C3): 2=3.27V 3=3.10V 4=2.92V 5=2.76V 6=2.64V 7=2.51V (SEL_7 = lowest threshold)
  CONFIG_LOG_DEFAULT_LEVEL_WARN=y         ; Reduce default log level (less output = fewer CPU wake-ups)
  CONFIG_LOG_DEFAULT_LEVEL=2              ; 0=NONE, 1=ERROR, 2=WARNING, 3=INFO, 4=DEBUG
  CONFIG_ESP_TEMP_SENSOR_ENABLED=n        ; Disable unused temperature sensor
  
  ; RF/PHY: reduce TX power to minimum useful level
  CONFIG_ESP_PHY_MAX_WIFI_TX_POWER=8      ; 8 = +8 dBm
  CONFIG_ESP_PHY_MAX_TX_POWER=8           ; 8 = +8 dBm
  CONFIG_ESP_PHY_REDUCE_TX_POWER=y        ; Enable global TX power reduction
  
  ; RF calibration
  CONFIG_ESP_PHY_RF_CAL_NONE=y                  ; Skip RF calibration on every boot (fastest boot, lowest boot power)
  CONFIG_ESP_PHY_CALIBRATION_AND_DATA_STORAGE=n ; Don't store RF calibration data in NVS (saves flash wear and NVS space)
  
  ; BLE stack
  CONFIG_BT_ENABLED=y                         ; Enable Bluetooth controller
  CONFIG_BT_BLE_ENABLED=y                     ; Enable BLE (Bluetooth Low Energy)
  CONFIG_BT_CLASSIC_ENABLED=n                 ; Disable Classic Bluetooth (not needed, saves flash and RAM)
  CONFIG_BT_BLE_42_FEATURES_SUPPORTED=y       ; Enable BLE 4.2 features
  CONFIG_BT_NIMBLE_ENABLED=y                  ; Use NimBLE host stack (more lightweight than Bluedroid)
  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3          ; Limit max concurrent BLE connections to save RAM
  CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=y  ; Use internal memory for NimBLE
  CONFIG_BT_CTRL_SLEEP_MODE_EFF=1             ; BLE Controller Sleep (radio off between BLE events — biggest power saver)
  CONFIG_BT_CTRL_SLEEP_CLOCK_EFF=1            ; Use RTC slow clock for BLE controller sleep
  CONFIG_BT_CTRL_BLE_MAX_ACT_EFF=6            ; Limit max concurrent BLE activities (advertising + scan + connections)
  CONFIG_BT_CTRL_DFT_TX_POWER_LEVEL_EFF=0     ; Default BLE TX power: 0 = -12 dBm (minimum), tune up if range insufficient
  CONFIG_BT_CTRL_SCAN_DUPL_TYPE_DEVICE=y      ; Device-based scan duplicate filtering (reduces processing during BLE scan)
  CONFIG_BT_CTRL_SCAN_DUPL_CACHE_SIZE=20      ; Cache size for scan duplicate filtering
  
  ; Task Watchdog Timer
  CONFIG_ESP_TASK_WDT_TIMEOUT_S=10            ; Task Watchdog timeout 10 s
  ; WiFi: kept enabled — lib/knx and OGM-Common link against Arduino WiFi / esp_wifi symbols.
  ; PHY draws NO power as long as WiFi.begin() is never called.
  ; NOTE: SoftAP must stay enabled — WiFiGeneric.cpp calls esp_netif_create_default_wifi_ap() unconditionally.
  CONFIG_ESP_WIFI_NAN_ENABLE=n                ; Disable WiFi NAN (Neighbour Awareness Networking) — unused
  CONFIG_ESP_WIFI_STATION_ROAMING_EXT_CALIBRATION=n ; Disable roaming external calibration — unused
  
  ; Disable unused telemetry
  CONFIG_ESP_INSIGHTS_ENABLED=n               ; Disable ESP Insights
  CONFIG_ESP_DIAGNOSTICS_ENABLED=n            ; Disable ESP Diagnostics

; ===================================================================== #
; Preset: ESP32-C5 IDF
; Doc: https://docs.espressif.com/projects/esp-idf/en/v5.5.2/esp32c5/api-reference/kconfig-reference.html
; ===================================================================== # 
[esp32c5_sdkcfg_low_power]
board_build.f_cpu = 80000000L
custom_sdkconfig =
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_80=y    ; Set CPU frequency to 80 MHz (lowest clock that still allows WiFi + BLE)
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ=80      ; Set default CPU frequency to 80 MHz
  ; Power Management: DISABLED on C5 — pioarduino 55.03.36 prebuilt libs for C5 have an
  ; incomplete linker script: sleep_modes.c.o produces orphan section
  ; `.rodata.esp_sleep_sub_mode_config.str1.4` which creates an illegal gap between
  ; .eh_frame and .flash.tdata → fatal link error.
  ; BLE controller sleep (BT_CTRL_SLEEP_MODE_EFF) works independently of CONFIG_PM_ENABLE
  ; and is NOT affected by this setting. Re-enable once C5 linker script is mature.
  CONFIG_PM_ENABLE=n                      ; MUST be n on C5 (linker script incomplete in current pioarduino libs)
  ; CONFIG_PM_SLP_IRAM_OPT also disabled since PM is off
  CONFIG_PM_SLP_IRAM_OPT=n               ; n — PM disabled, this has no effect but must not be y
  ; Brownout detection: SEL_7 = 2.51V (lowest threshold). Tolerates brief voltage dips during BLE startup.
  ; Software guard: BLE_INIT_DELAY_MS = 3 s gives supply time to settle first.
  CONFIG_ESP_BROWNOUT_DET=y               ; Enable brownout detection
  CONFIG_ESP_BROWNOUT_DET_LVL=7           ; Levels (C5): 2=3.27V 3=3.10V 4=2.92V 5=2.76V 6=2.64V 7=2.51V (SEL_7 = lowest threshold)
  ;CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y    ; USB Serial/JTAG console — frees UART0 pins for KNX UART
  ;CONFIG_ESP_CONSOLE_UART_NONE=y          ; Disable UART console
  
  ; RF/PHY: reduce TX power to minimum useful level
  CONFIG_ESP_PHY_MAX_WIFI_TX_POWER=8      ; 8 = +8 dBm
  CONFIG_ESP_PHY_MAX_TX_POWER=8           ; 8 = +8 dBm
  CONFIG_ESP_PHY_REDUCE_TX_POWER=y        ; Enable global TX power reduction (applies to WiFi and BLE)
  
  ; RF calibration
  CONFIG_ESP_PHY_RF_CAL_NONE=y                  ; Skip RF calibration on every boot (fastest boot, lowest boot power)
  CONFIG_ESP_PHY_CALIBRATION_AND_DATA_STORAGE=n ; Don't store RF calibration data in NVS (saves flash wear and NVS space)
  
  ; BLE stack
  CONFIG_BT_ENABLED=y                         ; Enable Bluetooth controller
  CONFIG_BT_BLE_ENABLED=y                     ; Enable BLE (Bluetooth Low Energy)
  CONFIG_BT_CLASSIC_ENABLED=n                 ; Disable Classic Bluetooth (not needed, saves flash and RAM)
  CONFIG_BT_BLE_42_FEATURES_SUPPORTED=y       ; Enable BLE 4.2 features
  CONFIG_BT_NIMBLE_ENABLED=y                  ; Use NimBLE host stack (more lightweight than Bluedroid)
  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3          ; Limit max concurrent BLE connections to save RAM
  CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=y  ; Use internal memory for NimBLE
  
  CONFIG_BT_CTRL_SLEEP_MODE_EFF=1             ; BLE Controller Sleep (radio off between BLE events — biggest power saver)
  CONFIG_BT_CTRL_SLEEP_CLOCK_EFF=1            ; Use RTC slow clock for BLE controller sleep
  CONFIG_BT_CTRL_BLE_MAX_ACT_EFF=6            ; Limit max concurrent BLE activities (advertising + scan + connections)
  CONFIG_BT_CTRL_DFT_TX_POWER_LEVEL_EFF=0     ; Default BLE TX power: 0 = -12 dBm (minimum), tune up if range insufficient
  CONFIG_BT_CTRL_SCAN_DUPL_TYPE_DEVICE=y      ; Device-based scan duplicate filtering (reduces processing during BLE scan)
  CONFIG_BT_CTRL_SCAN_DUPL_CACHE_SIZE=20      ; Cache size for scan duplicate filtering
  
  ; Task Watchdog Timer
  CONFIG_ESP_TASK_WDT_TIMEOUT_S=10            ; Task Watchdog timeout 10 s
  ; WiFi: kept enabled — lib/knx and OGM-Common link against Arduino WiFi / esp_wifi symbols.
  ; PHY draws NO power as long as WiFi.begin() is never called.
  ; NOTE: SoftAP must stay enabled — WiFiGeneric.cpp calls esp_netif_create_default_wifi_ap() unconditionally.
  CONFIG_ESP_WIFI_NAN_ENABLE=n                ; Disable WiFi NAN (Neighbour Awareness Networking) — unused
  CONFIG_ESP_WIFI_STATION_ROAMING_EXT_CALIBRATION=n ; Disable roaming external calibration — unused
  
  ; Disable unused telemetry
  CONFIG_ESP_INSIGHTS_ENABLED=n               ; Disable ESP Insights
  CONFIG_ESP_DIAGNOSTICS_ENABLED=n            ; Disable ESP Diagnostics
  
  ; ── C5: LP core (ULP-RISC-V) — uncomment to disable if not used ──────────
  ; C5 has no IEEE 802.15.4 / Zigbee / Thread radio (unlike C6).
  ; The LP core is unused in this firmware; disable to save idle current.
  ; CONFIG_ULP_COPROC_ENABLED=n              ; disable LP RISC-V core (not used in this firmware)
  ; ─────────────────────────────────────────────────────────────────────────

; ===================================================================== #
; Preset: ESP32-C6 IDF
; Doc: https://docs.espressif.com/projects/esp-idf/en/v5.5.2/esp32c6/api-reference/kconfig-reference.html
; ===================================================================== #
[esp32c6_sdkcfg_low_power]
board_build.f_cpu = 80000000L
custom_sdkconfig =
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_80=y ; Set CPU frequency to 80 MHz (lowest for WiFi + BLE)
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ=80 ; Set default CPU frequency to 80 MHz (min. CPU=90 and max. CPU=240
  ; Power Management: DFS — CPU clock scales down automatically when idle
  CONFIG_PM_ENABLE=y
  CONFIG_PM_SLP_IRAM_OPT=y
  ; Brownout detection: SEL_0 = 2.43V (lowest threshold).
  ; The C6 has a more stable 3.3V LDO (USB-C input) than KNX bus-powered boards,
  ; so we keep HW brownout ON but at the lowest level to tolerate BLE startup spikes.
  ; S3 uses DET=n because it runs from KNX bus power; C6/XIAO is USB-powered.
  ; Software guard: BLE_INIT_DELAY_MS = 3 s gives supply time to settle first.
  CONFIG_ESP_BROWNOUT_DET=y             ; Enable/disable brownout detection
  CONFIG_ESP_BROWNOUT_DET_LVL=7         ; Levels: 2=3.27V 3=3.10v 4=2.92V 5=2.76V 6=2.64V 7=2.51V (SEL_7) is the lowest threshold
  ;CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y  ; USB Serial/JTAG console — frees GPIO UART0 pins for KNX UART
  ;CONFIG_ESP_CONSOLE_UART_NONE=y        ; Disable UART console
  
  ; ── C6-specific: 802.15.4 / Zigbee / Thread / LP core ──────────────────
  ; The C6 embeds a second radio for IEEE 802.15.4 (Zigbee baseline / Thread).
  ; It is enabled by default and draws ~5–10 mA idle current even if unused.
  ; Uncomment all four lines below to disable the radio and save power when
  ; Zigbee / Thread / LP core are not needed (pure BLE+WiFi build):
  
  ; CONFIG_IEEE802154_ENABLED=n      ; disable the 802.15.4 radio hardware
  ; CONFIG_ZB_ENABLED=n              ; disable Zigbee stack (depends on 802.15.4)
  ; CONFIG_OPENTHREAD_ENABLED=n      ; disable OpenThread stack (depends on 802.15.4)
  ; CONFIG_ULP_COPROC_ENABLED=n      ; disable LP RISC-V core (not used in this firmware)
  ; ─────────────────────────────────────────────────────────────────────────
  
  ; RF/PHY: reduce TX power to minimum useful level
  CONFIG_ESP_PHY_MAX_WIFI_TX_POWER=8   ; 8 = +8 dBm (minimum for ESP32-C6, which has a more efficient PA than S3)
  CONFIG_ESP_PHY_MAX_TX_POWER=8        ; 8 = +8 dBm (minimum for ESP32-C6, which has a more efficient PA than S3)
  CONFIG_ESP_PHY_REDUCE_TX_POWER=y     ; Enable global TX power reduction (applies to WiFi and BLE)
  
  ; RF calibration
  CONFIG_ESP_PHY_RF_CAL_NONE=y                  ; Skip RF calibration on every boot (fastest boot, lowest boot power)
  CONFIG_ESP_PHY_CALIBRATION_AND_DATA_STORAGE=n ; Don't store RF calibration data in NVS (saves flash wear and NVS space)
  
  ; BLE stack
  CONFIG_BT_ENABLED=y                         ; Enable Bluetooth (BTDM) controller and Bluedroid host stack
  CONFIG_BT_BLE_ENABLED=y                     ; Enable BLE (Bluetooth Low Energy) support in the BTDM controller and Bluedroid host stack
  CONFIG_BT_CLASSIC_ENABLED=n                 ; Disable Classic Bluetooth support (not needed, saves flash and RAM)
  CONFIG_BT_BLE_42_FEATURES_SUPPORTED=y       ; Enable BLE 5.2/5.4 features (e.g. long range, high throughput)
  CONFIG_BT_NIMBLE_ENABLED=y                  ; Use NimBLE as the BLE host stack (more lightweight than Bluedroid)
  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3          ; Limit max concurrent BLE connections to save RAM (adjust as needed)
  CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=y  ; Use internal memory allocation for NimBLE (simpler, more efficient for small number of connections)
  
  CONFIG_BT_CTRL_SLEEP_MODE_EFF=1             ; Enable BLE Controller Sleep mode (radio off between BLE events for lowest power)
  CONFIG_BT_CTRL_SLEEP_CLOCK_EFF=1            ; Use RTC slow clock for BLE controller sleep (lowest power)
  CONFIG_BT_CTRL_BLE_MAX_ACT_EFF=6            ; Limit max concurrent BLE activities (advertising + scan + connections) to save power (adjust as needed)
  CONFIG_BT_CTRL_DFT_TX_POWER_LEVEL_EFF=0     ; Set default BLE TX power level. Range is 0 (min -12 dBm) to 7 (max +9 dBm) for ESP32-C6.
  CONFIG_BT_CTRL_SCAN_DUPL_TYPE_DEVICE=y      ; Enable device-based scan duplicate filtering (reduces processing load during BLE scan)
  CONFIG_BT_CTRL_SCAN_DUPL_CACHE_SIZE=20      ; Size of the cache for BLE scan duplicate filtering (number of devices to track). Adjust based on expected number of nearby BLE devices and available RAM.
  
  ; Task Watchdog Timer
  CONFIG_ESP_TASK_WDT_TIMEOUT_S=10 ; Set Task Watchdog timeout to 10 seconds (adjust as needed for your application)
  ; WiFi: kept enabled (required by Arduino WiFi symbols), PHY draws no power unless WiFi.begin() is called
  ; NOTE: SoftAP support must stay enabled — Arduino WiFiGeneric.cpp calls
  ; esp_netif_create_default_wifi_ap() unconditionally.
  CONFIG_ESP_WIFI_NAN_ENABLE=n
  CONFIG_ESP_WIFI_STATION_ROAMING_EXT_CALIBRATION=n
  
  ; Disable unused telemetry
  CONFIG_ESP_INSIGHTS_ENABLED=n
  CONFIG_ESP_DIAGNOSTICS_ENABLED=n