; Open ■
; ┬────┴  platformio.custom.sdkcfg.ini
; ■ KNX   2026 OpenKNX - Erkan Çolak
; ###########################################################################################################
;
; This file contains the custom SDKConfig presets for ESP32 IDF builds. These are added to an 
; environment's sdkconfig via the "custom_sdkconfig" key. Each preset is a reusable collection of CONFIG_ 
; options that can be sdkconfig via the "custom_sdkconfig" key. Each preset is a reusable collection of 
; CONFIG_ options that can be shared across multiple environments and boards. 
; 
; The custom_sdkconfig key triggers pioarduino's call_compile_libs() which builds the ESP-IDF from source.
;
; Example usage (in project platformio.custom.ini):
;   [env:release_MY_BOARD_LOW_POWER]
;   extends = ESP32_8MB, board_MY_BOARD, custom_release_ESP32, sdkcfg_ble_only, esp32idf
;   custom_idf_build = true
;   custom_sdkconfig = ${sdkcfg_ble_only.custom_sdkconfig}
;
; ###########################################################################################################

; =====================================================================;
; Preset: ESP32-S3 IDF
; Doc: https://docs.espressif.com/projects/esp-idf/en/v5.5.2/esp32s3/api-reference/kconfig-reference.html
; =====================================================================;
[esp32s3_sdkcfg_low_power]
board_build.f_cpu = 80000000L
custom_sdkconfig =
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_80=y    ; Set CPU frequency to 80 MHz (lowest clock that still allows WiFi + BLE)
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ=80      ; Set default CPU frequency to 80 MHz
  ; Power Management: DFS — CPU clock scales down automatically when idle. Light-sleep NOT used (continuous main loop).
  CONFIG_PM_ENABLE=y                      ; Enable IDF power management (DFS: CPU clock scales down when idle)
  CONFIG_PM_SLP_IRAM_OPT=y               ; Put sleep/wake stub in IRAM for faster wake-up (used by BLE controller sleep)
  ; Brownout detection: DISABLED on S3 — runs from KNX bus power (not USB LDO), voltage is less stable.
  ; S3 levels: 1=3.30V 2=3.19V 3=2.98V 4=2.84V 5=2.67V 6=2.56V 7=2.44V — even SEL_7 (2.44V) is too close
  ; to the 2.3–2.4V dip during BLE startup → causes brownout-reboot loop.
  ; Software guard: BLE_INIT_DELAY_MS = 3 s lets voltage stabilise before enabling BLE.
  CONFIG_ESP_BROWNOUT_DET=n               ; Brownout detection disabled (KNX bus-powered, voltage unstable at BLE init)
  CONFIG_ESP_BROWNOUT_DET_LVL=7           ; Levels (S3): 1=3.30V 2=3.19V 3=2.98V 4=2.84V 5=2.67V 6=2.56V 7=2.44V (irrelevant, DET=n)
  CONFIG_LOG_DEFAULT_LEVEL_WARN=y         ; Reduce default log level (less UART/USB output = fewer CPU wake-ups)
  CONFIG_LOG_DEFAULT_LEVEL=2              ; 0=NONE, 1=ERROR, 2=WARNING, 3=INFO, 4=DEBUG
  CONFIG_ESP_TEMP_SENSOR_ENABLED=n        ; Disable unused temperature sensor
  CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y    ; USB Serial/JTAG console — frees GPIO 43/44 (UART0) for KNX UART
  CONFIG_ESP_CONSOLE_UART_NONE=y          ; Disable UART console
  
  ; RF/PHY: reduce TX power to minimum useful level
  CONFIG_ESP_PHY_MAX_WIFI_TX_POWER=8      ; 8 = +8 dBm
  CONFIG_ESP_PHY_MAX_TX_POWER=8           ; 8 = +8 dBm
  CONFIG_ESP_PHY_REDUCE_TX_POWER=y        ; Enable global TX power reduction (applies to WiFi and BLE)
  
  ; RF calibration
  CONFIG_ESP_PHY_RF_CAL_NONE=y                  ; Skip RF calibration on every boot (fastest boot, lowest boot power)
  CONFIG_ESP_PHY_CALIBRATION_AND_DATA_STORAGE=n ; Don't store RF calibration data in NVS (saves flash wear and NVS space)
  
  ; BLE stack
  CONFIG_BT_ENABLED=y                         ; Enable Bluetooth controller
  CONFIG_BT_BLE_ENABLED=y                     ; Enable BLE (Bluetooth Low Energy)
  CONFIG_BT_CLASSIC_ENABLED=n                 ; Disable Classic Bluetooth (not needed, saves flash and RAM)
  CONFIG_BT_BLE_42_FEATURES_SUPPORTED=y       ; Enable BLE 4.2 features
  CONFIG_BT_NIMBLE_ENABLED=y                  ; Use NimBLE host stack (more lightweight than Bluedroid)
  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3          ; Limit max concurrent BLE connections to save RAM
  CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=y  ; Use internal memory for NimBLE  
  CONFIG_BT_CTRL_SLEEP_MODE_EFF=1             ; BLE Controller Sleep (radio off between BLE events — biggest power saver)
  CONFIG_BT_CTRL_SLEEP_CLOCK_EFF=1            ; Use RTC slow clock for BLE controller sleep
  CONFIG_BT_CTRL_BLE_MAX_ACT_EFF=6            ; Limit max concurrent BLE activities (advertising + scan + connections)
  CONFIG_BT_CTRL_DFT_TX_POWER_LEVEL_EFF=0     ; Default BLE TX power: 0 = -12 dBm (minimum), tune up if range insufficient
  CONFIG_BT_CTRL_SCAN_DUPL_TYPE_DEVICE=y      ; Device-based scan duplicate filtering (reduces processing during BLE scan)
  CONFIG_BT_CTRL_SCAN_DUPL_CACHE_SIZE=20      ; Cache size for scan duplicate filtering
  
  ; Task Watchdog Timer
  CONFIG_ESP_TASK_WDT_TIMEOUT_S=10            ; Task Watchdog timeout 10 s
  ; WiFi: kept enabled — lib/knx and OGM-Common link against Arduino WiFi / esp_wifi symbols.
  ; PHY draws NO power as long as WiFi.begin() is never called.
  ; NOTE: SoftAP must stay enabled — WiFiGeneric.cpp calls esp_netif_create_default_wifi_ap() unconditionally.
  CONFIG_ESP_WIFI_NAN_ENABLE=n                ; Disable WiFi NAN (Neighbour Awareness Networking) — unused
  CONFIG_ESP_WIFI_STATION_ROAMING_EXT_CALIBRATION=n ; Disable roaming external calibration — unused
  
  ; Disable unused telemetry
  CONFIG_ESP_INSIGHTS_ENABLED=n               ; Disable ESP Insights
  CONFIG_ESP_DIAGNOSTICS_ENABLED=n            ; Disable ESP Diagnostics

