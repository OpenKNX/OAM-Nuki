; ============================================================================
; Custom Board Definitions for PlatformIO
; ============================================================================
; This file contains custom board configurations that are not yet available
; in the default PlatformIO board definitions.
; ============================================================================

; ----------------------------------------------------------------------------
; Seeed XIAO ESP32C5
; Not yet in PlatformIO board registry (as of 2026-02) → custom definition
; Flash: 8MB, MCU: ESP32-C5 (RISC-V), USB-CDC
; ----------------------------------------------------------------------------
[custom_board_seeed_xiao_esp32c5]
platform = espressif32
framework = arduino
board_build.mcu = esp32c5
board_build.variant = XIAO_ESP32C5
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.arduino.ldscript = esp32c5_out.ld
board_build.arduino.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_upload.maximum_ram_size = 327680
board_upload.speed = 921600
board_build.extra_flags =
    -DARDUINO_XIAO_ESP32C5
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder


; ------ OpenKNXXIAO ESP32C3 Mini V1 ------
[board_OKNXHW_OPENKNXIAO_ESP32C3_MINI_V1]
extends = ESP32_4MB
board = seeed_xiao_esp32c3
build_flags =
  -D OKNXHW_OPENKNXIAO_ESP32C3_MINI_V1  ; Board ID for conditional compilation (from HardwareConfig.h)

; ------ OpenKNXXIAO ESP32C5 Mini V1 ------
[board_OKNXHW_OPENKNXIAO_ESP32C5_MINI_V1]
extends = custom_board_seeed_xiao_esp32c5
build_flags =
  -D OKNXHW_OPENKNXIAO_ESP32C5_MINI_V1  ; Board ID for conditional compilation (from HardwareConfig.h)


; ------ OpenKNXXIAO ESP32C6 Mini V1 ------
[board_OKNXHW_OPENKNXIAO_ESP32C6_MINI_V1]
extends = ESP32_4MB
board = seeed_xiao_esp32c6
build_flags =
  -D OKNXHW_OPENKNXIAO_ESP32C6_MINI_V1  ; Board ID for conditional compilation (from HardwareConfig.h)

; ------ OpenKNXXIAO ESP32S3 Mini V1 ------
[board_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1]
extends = ESP32_8MB
board = seeed_xiao_esp32s3
build_flags =
  -D OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1             ; Board ID for conditional compilation (from HardwareConfig.h)
  -D OPENKNX_INFOLED1_DEFAULT=1                    ; Info1 LED is prog LED
  -D INFO1_LED_PIN=OKNXHW_OPENKNXIAO_LED_1_YELLOW  ; Use OnBoard User LED as Info1 LED
  -D INFO1_LED_PIN_ACTIVE_ON=0                     ; OnBoard User LED is active LOW
  -D PROG_LED_PIN=-1                               ; Deactivate prog LED, because Info1 LED is used as prog LED
