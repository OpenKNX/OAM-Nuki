[env:release_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1]
extends = custom_release_ESP32, ESP32_8MB, board_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1_USB
build_flags =
   ${custom_release_ESP32.build_flags}  
   ${board_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1_USB.build_flags}


[env:release_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1_LOW_POWER_CONSUMPTION]
extends = ESP32_8MB, board_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1_USB, custom_release_ESP32, sdkcfg_wifi_on_nocal
; board+framework direkt gesetzt, damit custom_release_ESP32 ([ESP32] -> esp32dev) nicht überschreibt.
board = seeed_xiao_esp32s3
framework = arduino
; custom_idf_build: Guard-Flag für pre_generate_crt_asm.py und clean_idf_artifacts.py.
; Nur Envs mit diesem Flag triggern die IDF-spezifischen Pre-Scripts.
custom_idf_build = true
; custom_sdkconfig MUSS direkt im [env:*]-Abschnitt stehen (nicht nur über extends),
; damit config.has_option() in arduino.py / espidf.py True zurückgibt.
; Das triggert pioarduino's call_compile_libs() → IDF wird aus Source gebaut.
custom_sdkconfig = ${sdkcfg_wifi_on_nocal.custom_sdkconfig}
build_flags =
   ${custom_release_ESP32.build_flags}  
   ${board_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1_USB.build_flags}