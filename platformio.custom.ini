;
; global custom
;

; Override platform version from OGM-Common submodule.
; pioarduino 55.03.37 = Arduino 3.3.7, ESP-IDF 5.5.2.260206 (2026-02-13)
[ESP32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip

[custom]
build_flags =
  ${KNX_TP.build_flags}
  -D SERIAL_DEBUG=Serial
  -D KNX_FLASH_CALLBACK
  -D KNX_FLASH_SIZE=0 #Setting not used because partion knx is used, but must be defined
  -D BLESCANNER_USE_LATEST_NIMBLE
  -D NUKI_USE_LATEST_NIMBLE
  -D DEBUG_NUKI_COMMUNICATION
  -D NUKI_NO_WDT_RESET
  -D NUKI_ALT_CONNECT
  -D NUKI_MUTEX_RECURSIVE
  -D NUKI_64BIT_TIME
  -D OPENKNX_DUALCORE
  -D OPENKNX_LEDFUNC_BASE_PROG_UNCONFIGUREDSUPPORT
lib_deps =
   h2zero/NimBLE-Arduino@2.3.6
   https://github.com/mgeramb/BleScanner#ca286d1cef0638ead12b379a5b14766dc59dff1d


; ===================================================================================
; Development
; ===================================================================================
; ------------------------------
; Common base for all developments
; ------------------------------
[custom_development_ESP32]
extends = ESP32_develop, custom 
build_type = release ; Use release because debug causes app crash at startup for unknown reason
build_flags =
  -g ; Generate debug info - used instead of buid_type=debug 
  ${ESP32_develop.build_flags}
  ${custom.build_flags}

; --------------
; DEV Adafruit 
; --------------
[board_Adafruit_Feather_ESP32_V2]
extends = ESP32_8MB
build_flags =
  -D DEVICE_ADAFRUIT_ESP32_FEATHER_V2
  -D KNX_UART_NUM=1
  -D KNX_IP_WIFI
board = adafruit_feather_esp32_v2

[env:develop_Adafruit_Feather_ESP32_V2_TP]
extends = custom_development_ESP32, ESP32_8MB, board_Adafruit_Feather_ESP32_V2
build_flags =
   ${custom_development_ESP32.build_flags}  
   ${board_Adafruit_Feather_ESP32_V2.build_flags}

[env:develop_Adafruit_Feather_ESP32_V2_OTA]
extends = env:develop_Adafruit_Feather_ESP32_V2
upload_protocol = espota
upload_port = x.x.x.x # 192.168.0.30 # IP Address


; -------------
; DEV REG1
; -------------
[env:develop_REG1_ESP_DEV_TP_USB]
extends = custom_development_ESP32, ESP32_8MB, ESP32_UPLOAD_USB
build_flags =
  ${custom_development_ESP32.build_flags}
  ${KNX_TP.build_flags}
  -D DEVICE_DEV_REG1_LAN_TP_Base_V00_11
  -D BOARD_HAS_PSRAM
  -D SERIAL_DEBUG=Serial
  -D OPENKNX_LED_TIME=info3Led

; -----------------
; DEV OpenKNX XIAO
; -----------------
[env:develop_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1_USB]
extends = custom_development_ESP32, board_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1
build_flags =
  ${custom_development_ESP32.build_flags}
  ${board_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1.build_flags}
  -D DEVELOPMENT

; ==================================================================================
; Releases
; ==================================================================================
; ------------------------------
; Common base for all releases
; ------------------------------
[custom_release_ESP32]
extends = ESP32_releases, custom
build_flags =
  ${ESP32_releases.build_flags}
  ${custom.build_flags}

; -----------------------------------------------------------------------
; OFM Nuki — optional build flags (all commented out = defaults active)
;
; Usage: extend an env section with "custom_ofm_nuki_config" and
; uncomment only the flags you want to override, e.g.:
;   [env:release_MyBoard]
;   extends = custom_release_ESP32, board_MyBoard, custom_ofm_nuki_config
; -----------------------------------------------------------------------
[custom_ofm_nuki_config]
build_flags =
  ; --- NukiChannel.h: Nuki communication timing ----------------------------
  ; How often to poll the lock state when NO BLE notifications are received.
  ; Every poll opens a BLE connection — longer interval = less power draw.
  ; Default: 43200000 (12 hours)
  -D NUKI_STATE_POLL_INTERVAL_MS=43200000

  ; Short re-poll delay right after a notification (Nuki needs settle time).
  ; Default: 30000 (30 seconds)
  -D NUKI_STATE_RETRY_AFTER_NOTIFICATION_MS=30000

  ; After this time without a new notification the notification phase is
  ; considered over and the long poll interval becomes active again.
  ; Default: 120000 (2 minutes)
  -D NUKI_NOTIFICATION_TIMEOUT_MS=120000

  ; Retry pause when BLE initialisation fails.
  ; Default: 600000 (10 minutes)
  -D NUKI_REINIT_INTERVAL_MS=600000

  ; Interval between battery requests for the Opener channel.
  ; Default: 86400000 (24 hours)
  -D NUKI_OPENER_BATTERY_CHECK_INTERVAL_MS=86400000

  ; --- NukiModule.h: BLE scanner timing & power ----------------------------
  ; Delay after setup() before the BLE stack starts (supply voltage settles
  ; during this time → prevents brownout / reboot loop).
  ; Default: 3000 (3 seconds)
  -D BLE_INIT_DELAY_MS=3000

  ; Maximum time to stay in boot scan (100 % duty) waiting for all channels
  ; to fetch their initial state. Switches to low-power scan afterwards.
  ; Default: 60000 (60 seconds)
  -D BLE_INITIAL_STATE_TIMEOUT_MS=60000

  ; Boot scan: interval/window in BLE slots (1 slot = 0.625 ms).
  ; 23/23 = 100 % duty → fastest possible connection at startup.
  ; Default: 23 / 23  (≈ 14 ms / 14 ms)
  -D BLE_SCAN_INTERVAL_BOOT=23
  -D BLE_SCAN_WINDOW_BOOT=23

  ; Low-power scan: interval/window after boot phase.
  ; 160/48 ≈ 30 % duty → battery-friendly during normal operation.
  ; Default: 160 / 48  (≈ 100 ms / 30 ms)
  -D BLE_SCAN_INTERVAL_LP=160
  -D BLE_SCAN_WINDOW_LP=48
; -------------
; Adafruit
; -------------
[env:release_Adafruit_Feather_ESP32_V2_TP]
extends = custom_release_ESP32, ESP32_8MB, board_Adafruit_Feather_ESP32_V2
build_flags =
   ${custom_release_ESP32.build_flags}  
   ${board_Adafruit_Feather_ESP32_V2.build_flags}

[env:release_Adafruit_Feather_ESP32_V2_TP_OTA]
extends = custom_release_ESP32, ESP32_8MB, board_Adafruit_Feather_ESP32_V2
upload_protocol = espota
upload_port = #192.168.0.30 # IP Address
build_flags =
   ${custom_release_ESP32.build_flags}  
   ${board_Adafruit_Feather_ESP32_V2.build_flags}

