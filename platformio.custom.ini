;
; global custom
;
[custom]
extends = esp32idf
build_flags =
  ${KNX_TP.build_flags}
  -D SERIAL_DEBUG=Serial
  -D KNX_FLASH_CALLBACK
  -D KNX_FLASH_SIZE=0 #Setting not used because partion knx is used, but must be defined
  -D BLESCANNER_USE_LATEST_NIMBLE
  -D NUKI_USE_LATEST_NIMBLE
  -D DEBUG_NUKI_COMMUNICATION
  -D NUKI_NO_WDT_RESET
  -D NUKI_ALT_CONNECT
  -D NUKI_MUTEX_RECURSIVE
  -D NUKI_64BIT_TIME
  -D OPENKNX_DUALCORE
  -D OPENKNX_LEDFUNC_BASE_PROG_UNCONFIGUREDSUPPORT
lib_deps =
   h2zero/NimBLE-Arduino@2.3.6
   https://github.com/mgeramb/BleScanner#ca286d1cef0638ead12b379a5b14766dc59dff1d

[custom_release_ESP32]
extends = ESP32_releases, custom
build_flags =
  ${ESP32_releases.build_flags}
  ${custom.build_flags}
 
[custom_development_ESP32]
extends = ESP32_develop, custom 
build_type = release ; Use release because debug causes app crash at startup for unknown reason
build_flags =
  -g ; Generate debug info - used instead of buid_type=debug 
  ${ESP32_develop.build_flags}
  ${custom.build_flags} 
;
; sdkconfig presets for ESP32/IDF environments
; Extend any [env:*] with one of these to activate the IDF pre-scripts.
;
[sdkcfg_wifi_off]
custom_sdkconfig =
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_80=y
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ=80
  CONFIG_PM_ENABLE=y
  CONFIG_ESP_BROWNOUT_DET=y
  CONFIG_ESP_BROWNOUT_DET_LVL=6
  CONFIG_ESP_PHY_MAX_WIFI_TX_POWER=8
  CONFIG_ESP_PHY_MAX_TX_POWER=8
  CONFIG_ESP_PHY_REDUCE_TX_POWER=y
  CONFIG_ESP_PHY_RF_CAL_PARTIAL=y
  CONFIG_BT_ENABLED=y
  CONFIG_BT_BLE_ENABLED=y
  CONFIG_BT_CLASSIC_ENABLED=n
  CONFIG_BT_BLE_42_FEATURES_SUPPORTED=y
  CONFIG_BT_NIMBLE_ENABLED=y
  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
  CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=y
  CONFIG_BT_CTRL_DFT_TX_POWER_LEVEL_EFF=0
  CONFIG_ESP_TASK_WDT_TIMEOUT_S=10
  CONFIG_ESP_WIFI_ENABLED=n
  CONFIG_ESP_WIFI_SOFTAP_SUPPORT=n
  CONFIG_ESP_WIFI_NAN_ENABLE=n
  CONFIG_ESP_COEX_ENABLED=n
  CONFIG_ESP_WIFI_COEXIST_ENABLE=n
  CONFIG_ESP_WIFI_STATION_ROAMING_EXT_CALIBRATION=n
  CONFIG_ESP_INSIGHTS_ENABLED=n
  CONFIG_ESP_DIAGNOSTICS_ENABLED=n

[sdkcfg_wifi_on]
custom_sdkconfig =
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_80=y
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ=80
  CONFIG_PM_ENABLE=y
  CONFIG_ESP_BROWNOUT_DET=y
  CONFIG_ESP_BROWNOUT_DET_LVL=6
  CONFIG_ESP_PHY_MAX_WIFI_TX_POWER=8
  CONFIG_ESP_PHY_MAX_TX_POWER=8
  CONFIG_ESP_PHY_REDUCE_TX_POWER=y
  CONFIG_ESP_PHY_RF_CAL_PARTIAL=y
  CONFIG_BT_ENABLED=y
  CONFIG_BT_BLE_ENABLED=y
  CONFIG_BT_CLASSIC_ENABLED=n
  CONFIG_BT_BLE_42_FEATURES_SUPPORTED=y
  CONFIG_BT_NIMBLE_ENABLED=y
  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
  CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=y
  CONFIG_BT_CTRL_DFT_TX_POWER_LEVEL_EFF=0
  CONFIG_ESP_TASK_WDT_TIMEOUT_S=10
  CONFIG_ESP_WIFI_ENABLED=y
  CONFIG_ESP_WIFI_SOFTAP_SUPPORT=y
  CONFIG_ESP_WIFI_STATION_ENABLED=y
  CONFIG_ESP_COEX_ENABLED=y
  CONFIG_ESP_WIFI_COEXIST_ENABLE=y
  CONFIG_ESP_COEX_SW_COEXIST_ENABLE=y
  CONFIG_ESP_WIFI_STA_DISCONNECTED_PM_ENABLE=y
  CONFIG_ESP_WIFI_SCAN_CACHE_SIZE=6
  CONFIG_ESP_INSIGHTS_ENABLED=n
  CONFIG_ESP_DIAGNOSTICS_ENABLED=n

[sdkcfg_wifi_on_nocal]
custom_sdkconfig =
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_80=y
  CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ=80
  CONFIG_PM_ENABLE=y
  CONFIG_ESP_BROWNOUT_DET=y
  CONFIG_ESP_BROWNOUT_DET_LVL=6
  CONFIG_ESP_PHY_MAX_WIFI_TX_POWER=8
  CONFIG_ESP_PHY_MAX_TX_POWER=8
  CONFIG_ESP_PHY_REDUCE_TX_POWER=y
  CONFIG_BT_ENABLED=y
  CONFIG_BT_BLE_ENABLED=y
  CONFIG_BT_CLASSIC_ENABLED=n
  CONFIG_BT_BLE_42_FEATURES_SUPPORTED=y
  CONFIG_BT_NIMBLE_ENABLED=y
  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
  CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=y
  CONFIG_BT_CTRL_DFT_TX_POWER_LEVEL_EFF=0
  CONFIG_ESP_TASK_WDT_TIMEOUT_S=10
  CONFIG_ESP_WIFI_ENABLED=y
  CONFIG_ESP_WIFI_SOFTAP_SUPPORT=y
  CONFIG_ESP_WIFI_STATION_ENABLED=y
  ; RF-Kalibrierung: IDF-Choice, genau einer muss =y sein.
  ; RF_CAL_NONE = keine Kalibrierung beim Boot (schnellster Start, spart Strom).
  ; RF_CAL_PARTIAL = default (guter Kompromiss).
  ; RF_CAL_FULL = volle Kalibrierung bei jedem Boot (langsam, unnötig).
  CONFIG_ESP_PHY_RF_CAL_NONE=y
  ; Kalibrierungsdaten nicht im NVS speichern (spart Flash-Wear und NVS-Speicher)
  CONFIG_ESP_PHY_CALIBRATION_AND_DATA_STORAGE=n
  CONFIG_ESP_INSIGHTS_ENABLED=n
  CONFIG_ESP_DIAGNOSTICS_ENABLED=n


; ------ Adafruit ESP32 Feather V2 ------
[board_Adafruit_Feather_ESP32_V2]
extends = ESP32_8MB
build_flags =
  -D DEVICE_ADAFRUIT_ESP32_FEATHER_V2
  -D KNX_UART_NUM=1
  -D KNX_IP_WIFI
board = adafruit_feather_esp32_v2


[env:develop_Adafruit_Feather_ESP32_V2_TP]
extends = custom_development_ESP32, ESP32_8MB, board_Adafruit_Feather_ESP32_V2
build_flags =
   ${custom_development_ESP32.build_flags}  
   ${board_Adafruit_Feather_ESP32_V2.build_flags}


[env:develop_Adafruit_Feather_ESP32_V2_OTA]
extends = env:develop_Adafruit_Feather_ESP32_V2
upload_protocol = espota
upload_port = x.x.x.x # 192.168.0.30 # IP Address


; ------ REG1 ESP ------
[env:develop_REG1_ESP_DEV_TP_USB]
extends = custom_development_ESP32, ESP32_8MB, ESP32_UPLOAD_USB
build_flags =
  ${custom_development_ESP32.build_flags}
  ${KNX_TP.build_flags}
  -D DEVICE_DEV_REG1_LAN_TP_Base_V00_11
  -D BOARD_HAS_PSRAM
  -D SERIAL_DEBUG=Serial
  -D OPENKNX_LED_TIME=info3Led


; ------ OpenKNXXIAO ESP32S3 Mini V1 ------
[board_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1_USB]
extends = ESP32_8MB
board = seeed_xiao_esp32s3
build_flags =
  -D OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1
  -D OPENKNX_INFOLED1_DEFAULT=1 # Info1 LED is prog LED
  -D INFO1_LED_PIN=21 # Use OnBoard User LED as Info1 LED
  -D INFO1_LED_PIN_ACTIVE_ON=0
  -D PROG_LED_PIN=-1 # Deactivate prog LED, because Info1 LED is used as prog LED

 
[env:develop_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1_USB]
extends = custom_development_ESP32, board_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1_USB
build_flags =
  ${custom_development_ESP32.build_flags}
  ${board_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1_USB.build_flags}
  -D DEVELOPMENT


; Releases

[env:release_Adafruit_Feather_ESP32_V2_TP]
extends = custom_release_ESP32, ESP32_8MB, board_Adafruit_Feather_ESP32_V2
build_flags =
   ${custom_release_ESP32.build_flags}  
   ${board_Adafruit_Feather_ESP32_V2.build_flags}

[env:release_Adafruit_Feather_ESP32_V2_TP_LOW_POWER_CONSUMPTION]
extends = custom_release_ESP32, ESP32_8MB, board_Adafruit_Feather_ESP32_V2
; sdkcfg_wifi_off entfernt: Adafruit nutzt vorgebaute IDF-Libs (kein custom IDF-Build),
; CONFIG_* Werte aus sdkcfg_wifi_off haben dort keinerlei Effekt.
build_flags =
   ${custom_release_ESP32.build_flags}  
   ${board_Adafruit_Feather_ESP32_V2.build_flags}


[env:release_Adafruit_Feather_ESP32_V2_TP_OTA]
extends = custom_release_ESP32, ESP32_8MB, board_Adafruit_Feather_ESP32_V2
upload_protocol = espota
upload_port = #192.168.0.30 # IP Address
build_flags =
   ${custom_release_ESP32.build_flags}  
   ${board_Adafruit_Feather_ESP32_V2.build_flags}

