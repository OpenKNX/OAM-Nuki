[env:release_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1]
extends = custom_release_ESP32, ESP32_8MB, board_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1_USB
build_flags =
   ${custom_release_ESP32.build_flags}  
   ${board_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1_USB.build_flags}


[env:release_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1_LOW_POWER_CONSUMPTION]
extra_scripts =
  pre:scripts/pre_generate_crt_asm.py
  lib/OGM-Common/scripts/pio/prepare.py
  lib/OGM-Common/scripts/pio/create_esp32_image.py
extends = ESP32_8MB, custom_release_ESP32, sdkcfg_low_power, esp32idf, board_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1_USB
custom_idf_build = true                                 ; custom_idf_build: Guard-Flag for pre_generate_crt_asm.py and clean_idf_artifacts.py. Only Envs with this flag trigger the IDF-specific Pre-Scripts.
custom_sdkconfig = ${sdkcfg_low_power.custom_sdkconfig} ; custom_sdkconfig MUST be directly in the [env:*] section (not just via extends), so that config.has_option() in arduino.py / espidf.py returns True. This triggers pioarduino's call_compile_libs() -> IDF is built from source.
build_flags =
   ${custom_release_ESP32.build_flags}  
   ${board_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1_USB.build_flags}
   -D OPENKNX_IDF_INFO ; Show console output from IDF components (WiFi, BT stack, etc.) for debugging and verification of IDF config changes.
   -D OPENKNX_LEDGPIO_MAX_BRIGHTNESS=20 ; Limit max brightness of GPIO LEDs to 20 (out of 255) to reduce power consumption. Can be overridden by defining OPENKNX_LEDGPIO_MAX_BRIGHTNESS with a different value (e.g. in sdkconfig or via build_flags).