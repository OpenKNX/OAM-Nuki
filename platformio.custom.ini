;
; global custom
;
[custom]
build_flags =
  ${KNX_TP.build_flags}
  -D SERIAL_DEBUG=Serial
  -D KNX_FLASH_CALLBACK
  -D KNX_FLASH_SIZE=0 #Setting not used because partion knx is used, but must be defined
  -D BLESCANNER_USE_LATEST_NIMBLE
  -D NUKI_USE_LATEST_NIMBLE
  -D DEBUG_NUKI_COMMUNICATION
  -D NUKI_NO_WDT_RESET
  -D NUKI_ALT_CONNECT
  -D NUKI_MUTEX_RECURSIVE
  -D NUKI_64BIT_TIME
  -D OPENKNX_DUALCORE
  -D OPENKNX_LEDFUNC_BASE_PROG_UNCONFIGUREDSUPPORT
lib_deps =
   h2zero/NimBLE-Arduino@2.3.6
   https://github.com/mgeramb/BleScanner#ca286d1cef0638ead12b379a5b14766dc59dff1d


; ===================================================================================
; Development
; ===================================================================================
; ------------------------------
; Common base for all developments
; ------------------------------
[custom_development_ESP32]
extends = ESP32_develop, custom 
build_type = release ; Use release because debug causes app crash at startup for unknown reason
build_flags =
  -g ; Generate debug info - used instead of buid_type=debug 
  ${ESP32_develop.build_flags}
  ${custom.build_flags}

; --------------
; DEV Adafruit 
; --------------
[board_Adafruit_Feather_ESP32_V2]
extends = ESP32_8MB
build_flags =
  -D DEVICE_ADAFRUIT_ESP32_FEATHER_V2
  -D KNX_UART_NUM=1
  -D KNX_IP_WIFI
board = adafruit_feather_esp32_v2

[env:develop_Adafruit_Feather_ESP32_V2_TP]
extends = custom_development_ESP32, ESP32_8MB, board_Adafruit_Feather_ESP32_V2
build_flags =
   ${custom_development_ESP32.build_flags}  
   ${board_Adafruit_Feather_ESP32_V2.build_flags}

[env:develop_Adafruit_Feather_ESP32_V2_OTA]
extends = env:develop_Adafruit_Feather_ESP32_V2
upload_protocol = espota
upload_port = x.x.x.x # 192.168.0.30 # IP Address


; -------------
; DEV REG1
; -------------
[env:develop_REG1_ESP_DEV_TP_USB]
extends = custom_development_ESP32, ESP32_8MB, ESP32_UPLOAD_USB
build_flags =
  ${custom_development_ESP32.build_flags}
  ${KNX_TP.build_flags}
  -D DEVICE_DEV_REG1_LAN_TP_Base_V00_11
  -D BOARD_HAS_PSRAM
  -D SERIAL_DEBUG=Serial
  -D OPENKNX_LED_TIME=info3Led

; -----------------
; DEV OpenKNX XIAO
; -----------------
[env:develop_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1_USB]
extends = custom_development_ESP32, board_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1
build_flags =
  ${custom_development_ESP32.build_flags}
  ${board_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1.build_flags}
  -D DEVELOPMENT

; ==================================================================================
; Releases
; ==================================================================================
; ------------------------------
; Common base for all releases
; ------------------------------
[custom_release_ESP32]
extends = ESP32_releases, custom
build_flags =
  ${ESP32_releases.build_flags}
  ${custom.build_flags}

; -------------
; Adafruit
; -------------
[env:release_Adafruit_Feather_ESP32_V2_TP]
extends = custom_release_ESP32, ESP32_8MB, board_Adafruit_Feather_ESP32_V2
build_flags =
   ${custom_release_ESP32.build_flags}  
   ${board_Adafruit_Feather_ESP32_V2.build_flags}

[env:release_Adafruit_Feather_ESP32_V2_TP_LOW_POWER_CONSUMPTION]
extends = custom_release_ESP32, ESP32_8MB, board_Adafruit_Feather_ESP32_V2
; sdkcfg_wifi_off entfernt: Adafruit nutzt vorgebaute IDF-Libs (kein custom IDF-Build),
; CONFIG_* Werte aus sdkcfg_wifi_off haben dort keinerlei Effekt.
build_flags =
   ${custom_release_ESP32.build_flags}  
   ${board_Adafruit_Feather_ESP32_V2.build_flags}

[env:release_Adafruit_Feather_ESP32_V2_TP_OTA]
extends = custom_release_ESP32, ESP32_8MB, board_Adafruit_Feather_ESP32_V2
upload_protocol = espota
upload_port = #192.168.0.30 # IP Address
build_flags =
   ${custom_release_ESP32.build_flags}  
   ${board_Adafruit_Feather_ESP32_V2.build_flags}

; [env:release_Adafruit_Feather_ESP32_V2_IP]
; extends = custom_release_ESP32, ESP32_8MB, board_Adafruit_Feather_ESP32_V2
; build_flags =
;    ${custom_release_ESP32.build_flags}  
;    ${board_Adafruit_Feather_ESP32_V2.build_flags}
;   ${KNX_IP.build_flags}
;   -D OPENKNX_OVERRIDE_MASK_VERSION=0x07B0

; -------------
; OpenKNX XIAO 
; -------------
[env:release_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1]
extends = custom_release_ESP32, board_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1, sdkcfg_low_power, esp32idf ; It is important that esp32idf is at the END of the extends list to shadow [ESP32]'s extra_scripts with the IDF-compatible ones in [esp32idf]
custom_idf_build = true                                       ; custom_idf_build: Guard-Flag for pre_generate_crt_asm.py and clean_idf_artifacts.py. Only Envs with this flag trigger the IDF-specific Pre-Scripts.
custom_sdkconfig = ${sdkcfg_low_power.custom_sdkconfig}       ; custom_sdkconfig MUST be directly in the [env:*] section (not just via extends
build_flags =
   ${custom_release_ESP32.build_flags}                        ; common release flags (e.g. -D OPENKNX_WATCHDOG)
   ${board_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1.build_flags} ; board flags must be after custom_release_ESP32 to override any conflicting flags (e.g. flash size)
   -D OPENKNX_IDF_INFO                                        ; Show console output from IDF components (WiFi, BT stack, etc.) for debugging and verification of IDF config changes.

; For Testing: without custom SDKConfig (pre-built IDF libs) to verify that the same codebase and build infrastructure works with both pre-built and custom-built IDF.
[env:release_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1_DEFAULT_IDF]
extends = custom_release_ESP32, board_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1
build_flags =
   ${custom_release_ESP32.build_flags}                        ; common release flags (e.g. -D OPENKNX_WATCHDOG)
   ${board_OKNXHW_OPENKNXIAO_ESP32S3_MINI_V1.build_flags} ; board flags must be after custom_release_ESP32 to override any conflicting flags (e.g. flash size)
   -D OPENKNX_IDF_INFO                                        ; Show console output from IDF components (WiFi, BT stack, etc.) for debugging and verification of IDF config changes.


[env:release_OKNXHW_OPENKNXIAO_ESP32C3_MINI_V1]
extends = custom_release_ESP32, board_OKNXHW_OPENKNXIAO_ESP32C3_MINI_V1, sdkcfg_low_power, esp32idf
custom_idf_build = true
custom_sdkconfig = ${sdkcfg_low_power.custom_sdkconfig}
build_flags =
  ${custom_release_ESP32.build_flags}
  ${board_OKNXHW_OPENKNXIAO_ESP32C3_MINI_V1.build_flags}
  -D OPENKNX_IDF_INFO

[env:release_OKNXHW_OPENKNXIAO_ESP32C5_MINI_V1]
extends = custom_release_ESP32, board_OKNXHW_OPENKNXIAO_ESP32C5_MINI_V1, esp32c5_sdkcfg_low_power, esp32idf
custom_idf_build = true
custom_sdkconfig = ${esp32c5_sdkcfg_low_power.custom_sdkconfig}
build_flags =
  ${custom_release_ESP32.build_flags}
  ${board_OKNXHW_OPENKNXIAO_ESP32C5_MINI_V1.build_flags}
  -D OPENKNX_IDF_INFO

[env:release_OKNXHW_OPENKNXIAO_ESP32C6_MINI_V1]
extends = custom_release_ESP32, board_OKNXHW_OPENKNXIAO_ESP32C6_MINI_V1, esp32c6_sdkcfg_low_power, esp32idf
custom_idf_build = true
custom_sdkconfig = ${esp32c6_sdkcfg_low_power.custom_sdkconfig}
build_flags =
  ${custom_release_ESP32.build_flags}
  ${board_OKNXHW_OPENKNXIAO_ESP32C6_MINI_V1.build_flags}
  -D OPENKNX_IDF_INFO
